name: Сборка и публикация на reg.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Установить зависимости
        run: npm ci

      - name: Собрать сайт
        run: npm run build

      - name: Проверить, что сборка не пустая
        run: |
          test -f _site/index.html || (echo "Сборка пустая — публикация отменена" && exit 1)
          echo "Файлов собрано: $(find _site -type f | wc -l)"

      - name: Залить на reg.ru по FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: ./_site/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
