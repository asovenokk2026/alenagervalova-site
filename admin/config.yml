# ============================================================
#  Decap CMS — настройка админ-панели блога alenagervalova.ru
#  Панель открывается по адресу: https://alenagervalova.ru/admin/
# ============================================================

# ---------- АВТОРИЗАЦИЯ ----------
# Вариант 1 (рекомендуемый, работает и на Netlify, и на Vercel, вход по e-mail):
#   DecapBridge — бесплатный сервис авторизации для Decap CMS.
#   1. Зарегистрируйтесь на https://decapbridge.com, нажмите «Create site»,
#      укажите GitHub-репозиторий и ветку main, вставьте GitHub-токен по инструкции.
#   2. Скопируйте выданные identity_url и gateway_url сюда.
#   3. В DecapBridge → «Manage collaborators» пригласите e-mail Алены — придёт письмо со ссылкой.
backend:
  name: git-gateway
  repo: GITHUB_USER/alenagervalova-site        # ← ЗАМЕНИТЬ: владелец/название репозитория на GitHub
  branch: main
  identity_url: https://auth.decapbridge.com/sites/ВАШ_SITE_ID   # ← ЗАМЕНИТЬ на значение из DecapBridge
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: "Новая статья: {{slug}} — {{author-name}}"
    update: "Обновление статьи: {{slug}} — {{author-name}}"
    delete: "Удаление статьи: {{slug}} — {{author-name}}"
    uploadMedia: "Загрузка файла {{path}} — {{author-name}}"
    deleteMedia: "Удаление файла {{path}} — {{author-name}}"
    openAuthoring: "{{message}}"

# Вариант 2 (только Netlify, вход через аккаунт GitHub с правами на репозиторий):
#   Закомментируйте блок выше и раскомментируйте этот. В Netlify: Site configuration →
#   Access & security → OAuth → Install provider → GitHub (Client ID/Secret из GitHub OAuth App,
#   Authorization callback URL: https://api.netlify.com/auth/done).
# backend:
#   name: github
#   repo: GITHUB_USER/alenagervalova-site
#   branch: main
#   base_url: https://api.netlify.com

# Локальная разработка: `npx decap-server` + `npm run dev`, затем http://localhost:8080/admin/
local_backend: true

# Черновики: статья сначала сохраняется как черновик (Drafts), затем «In review» → «Ready»,
# и только по кнопке «Publish» попадает на сайт.
publish_mode: editorial_workflow

site_url: https://alenagervalova.ru
display_url: https://alenagervalova.ru
logo_url: /favicon-192.png
locale: ru

media_folder: "images/blog"     # куда сохраняются картинки в репозитории
public_folder: "/images/blog"   # как они доступны на сайте

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "blog"
    label: "Статьи блога"
    label_singular: "Статья"
    description: "Статьи блога. Адрес статьи на сайте: /blog/значение-поля-URL/"
    folder: "content/blog"
    create: true
    delete: true
    format: "frontmatter"
    extension: "md"
    slug: "{{fields.slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{date | date('DD.MM.YYYY')}} — {{category}}"
    sortable_fields: ["date", "title", "updated"]
    preview_path: "blog/{{fields.slug}}/"
    view_filters:
      - label: "Черновики"
        field: draft
        pattern: true
      - label: "Опубликованные"
        field: draft
        pattern: false
    editor:
      preview: true
    fields:
      - { label: "Заголовок (H1)", name: "title", widget: "string", hint: "Главный заголовок статьи. Он же используется в карточках и хлебных крошках." }
      - { label: "Краткое описание", name: "description", widget: "text", hint: "1–2 предложения. Показывается под заголовком, в карточках статей и в блоке «Читайте также». До 200 символов." , pattern: ["^.{20,240}$", "От 20 до 240 символов"] }
      - { label: "URL статьи (латиницей)", name: "slug", widget: "string", hint: "Только латинские буквы, цифры и дефис. Пример: kak-spravitsya-s-trevogoy → адрес /blog/kak-spravitsya-s-trevogoy/. Менять после публикации нежелательно (потеряются позиции в поиске).", pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Только строчные латинские буквы, цифры и дефисы, без пробелов"] }
      - { label: "Дата публикации", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false, picker_utc: false }
      - { label: "Дата обновления", name: "updated", widget: "datetime", required: false, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false, picker_utc: false, hint: "Заполните, если существенно переработали статью. Показывается на странице и передаётся поисковикам." }
      - { label: "Автор", name: "author", widget: "string", default: "Алена Гервалова" }
      - label: "Рубрика"
        name: "category"
        widget: "select"
        hint: "Список рубрик редактируется в файле _data/categories.json"
        options:
          - { label: "Тревога и стресс", value: "trevoga" }
          - { label: "Отношения", value: "otnosheniya" }
          - { label: "Самооценка и уверенность", value: "samoocenka" }
          - { label: "Выгорание и работа", value: "vygoranie" }
          - { label: "Привычки и зависимости", value: "privychki" }
          - { label: "Самопознание", value: "samopoznanie" }
          - { label: "КПТ и ЭОТ: методы", value: "kpt" }
          - { label: "Психология простыми словами", value: "psihologiya" }
      - { label: "Главное изображение", name: "image", widget: "image", required: false, hint: "Рекомендуемый размер 1200×675 px (16:9), JPG/WebP до 300 КБ. Используется в шапке статьи, карточках и для превью в соцсетях (Open Graph).", media_library: { config: { multiple: false } } }
      - { label: "Alt-текст изображения", name: "imageAlt", widget: "string", required: false, hint: "Что изображено на картинке — для поисковиков и людей со слабым зрением. Пример: «Женщина сидит у окна с чашкой чая и смотрит вдаль»." }
      - { label: "SEO Title (тег title)", name: "seoTitle", widget: "string", required: false, hint: "До 60 символов. Если пусто — будет «Заголовок — Алена Гервалова, психолог».", pattern: ["^.{0,70}$", "Не длиннее 70 символов"] }
      - { label: "Meta Description", name: "seoDescription", widget: "text", required: false, hint: "До 160 символов. Если пусто — берётся «Краткое описание».", pattern: ["^.{0,170}$", "Не длиннее 170 символов"] }
      - { label: "Текст статьи", name: "body", widget: "markdown", hint: "Заголовки разделов — H2, подразделы — H3 (кнопка «H» на панели или ## / ### в режиме Markdown). H1 в тексте не ставьте — он берётся из поля «Заголовок».", buttons: ["bold", "italic", "link", "heading-two", "heading-three", "heading-four", "quote", "bulleted-list", "numbered-list"], editor_components: ["image"], modes: ["rich_text", "raw"] }
      - label: "FAQ — частые вопросы"
        name: "faq"
        widget: "list"
        required: false
        allow_add: true
        collapsed: true
        summary: "{{fields.question}}"
        hint: "Блок «Частые вопросы» в конце статьи. Разметка FAQPage добавляется автоматически — вопросы могут показываться прямо в выдаче Google."
        fields:
          - { label: "Вопрос", name: "question", widget: "string" }
          - { label: "Ответ", name: "answer", widget: "text", hint: "Можно использовать простую разметку: **жирный**, ссылки [текст](https://…)" }
      - { label: "Черновик (не публиковать на сайте)", name: "draft", widget: "boolean", default: false, hint: "Если включено — статья не попадёт на сайт и в sitemap даже после нажатия Publish. Удобно, чтобы сохранить незаконченный текст в репозиторий." }
